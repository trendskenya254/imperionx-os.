# IMPERIONX OS v5.0 — Render Blueprint
# Review generated service names and provide prompted secrets before first deploy.
services:
  - type: web
    name: imperionx-api
    runtime: docker
    region: frankfurt
    plan: 1c-2g
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000 --workers 2
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_NAME
        value: IMPERIONX OS
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imperionx-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: PUBLIC_RATE_LIMIT_HMAC_KEY
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: AI_PROVIDER
        value: safe-demo
      - key: WEBHOOK_DELIVERY_ENABLED
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_TIMEOUT_SECONDS
        value: "30"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "1800"

  - type: web
    name: imperionx-frontend
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: IMPERIONX_API_INTERNAL
        fromService:
          name: imperionx-api
          type: web
          property: hostport

databases:
  - name: imperionx-db
    region: frankfurt
    plan: 0.5c-1g
    postgresMajorVersion: "16"
    databaseName: imperionx
    user: imperionx
    ipAllowList: []
