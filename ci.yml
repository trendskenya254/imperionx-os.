name: IMPERIONX OS CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend-and-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: imperionx
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: imperionx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imperionx -d imperionx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://imperionx:ci-only-password@localhost:5432/imperionx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt PyYAML
      - name: Compile backend
        run: python -m compileall -q backend/app backend/migrations backend/tests
      - name: Backend API and unit tests
        run: PYTHONPATH=backend python -m pytest -q backend/tests
      - name: PostgreSQL migrations and eight-worker concurrency test
        run: scripts/test_postgres.sh
      - name: Validate Render deployment blueprint
        run: python scripts/verify_render_blueprint.py
  frontend-and-containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Build backend container
        run: docker build -f backend/Dockerfile backend
      - name: Build frontend container
        run: docker build -f frontend/Dockerfile frontend
